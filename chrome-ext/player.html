<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Kokoro TTS Player</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 10px;
    }

    button {
      margin: 5px;
    }
  </style>
  <script type="module" crossorigin src="/player.js"></script>
  <link rel="modulepreload" crossorigin href="/kokoro-B_E-VYgx.js">
</head>

<body>
  <h3>Speech Output</h3>
  <div>
    <button id="play" aria-label="Play">▶</button>
    <button id="pause" aria-label="Pause">⏸</button>
    <button id="restart" aria-label="Restart">⟲</button>
    <button id="newspeech" aria-label="Generate new speech">New speech</button>
    <button id="save">Save WAV</button>
  </div>
  <div>
    <label>Progress:
      <input id="progress" type="range" value="0" min="0" step="0.01" style="width:100%">
    </label>
    <span id="time">0:00/0:00</span>
  </div>
  <div>
    <label>Volume:
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </label>
  </div>
  <div>
    <label>Speed:
      <input id="speed" type="range" min="0.5" max="1.5" step="0.1" value="1">
    </label>
  </div>
  <div id="status">Loading...</div>

</body>


</html>
